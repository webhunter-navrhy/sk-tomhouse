<form class="formular" method="post" {% if site.formular.endpoint and not site.formular.demo %}action="{{ site.formular.endpoint }}"{% endif %} data-endpoint="{{ site.formular.endpoint }}" data-demo="{{ 1 if site.formular.demo or not site.formular.endpoint else 0 }}">
  <fieldset class="formular__co">
    <legend>Čo potrebujete</legend>
    <label><input type="radio" name="co" value="vykop" checked> Výkop / zemné práce</label>
    <label><input type="radio" name="co" value="dlazba"> Zámková dlažba</label>
    <label><input type="radio" name="co" value="pozicovna"> Požičať techniku</label>
    <label><input type="radio" name="co" value="doprava"> Doprava materiálu</label>
  </fieldset>
  <div class="formular__riadok">
    <label>Meno <input name="meno" autocomplete="name" required></label>
    <label>Telefón <input name="telefon" type="tel" autocomplete="tel"></label>
  </div>
  <label>E-mail <input name="email" type="email" autocomplete="email" required></label>
  <label>Kde a čo treba urobiť <textarea name="sprava" rows="4" required placeholder="Napr. dvor 60 m² v Ilave, vykopať a vydláždiť. Alebo: doska 160 kg na sobotu."></textarea></label>
  <label class="formular__subor"><span class="subor__tl">+ Priložiť fotku pozemku</span><span class="subor__meno">nepovinné</span><input type="file" name="foto" accept="image/*"></label>
  <div class="past" aria-hidden="true"><label>Nevyplňovať <input name="_gotcha" tabindex="-1" autocomplete="off"></label></div>
  <input type="hidden" name="_subject" value="{{ site.formular.predmet }}">
  <button type="submit">Poslať dopyt</button>
  <p class="formular-stav" role="status" aria-live="polite"></p>
</form>
